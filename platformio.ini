; ============================================================
;  Cancela Inteligente ESP32  -  PlatformIO
;  Sem bibliotecas externas: so Arduino-ESP32 (WiFi, WebServer, LittleFS).
;  O servo e acionado direto pelo periferico LEDC (ver ServoDriver.cpp).
; ============================================================
[platformio]
default_envs = esp32dev

[env:esp32dev]
; Versao fixada: Arduino-ESP32 2.0.16 (API ledcSetup/ledcAttachPin)
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ENABLE_FAULT_SIM=0
; Os programas de teste e os testes de logica NAO entram neste ambiente
build_src_filter = +<*>

; ---- Firmware principal com simulacao de falha habilitada (apenas ensaios) ----
[env:faultsim]
extends = env:esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ENABLE_FAULT_SIM=1

; ---- Testes de hardware individuais (ver docs/testes.md) ----
; pio run -e hw_leds -t upload ; pio device monitor
[env:hw_leds]
extends = env:esp32dev
build_src_filter = -<*> +<../hardware_tests/t1_leds.cpp>

[env:hw_arrival]
extends = env:esp32dev
build_src_filter = -<*> +<../hardware_tests/t2_sensor_chegada.cpp>

[env:hw_obstacle]
extends = env:esp32dev
build_src_filter = -<*> +<../hardware_tests/t3_sensor_obstaculo.cpp>

[env:hw_servo]
extends = env:esp32dev
build_src_filter = -<*> +<../hardware_tests/t4_servo.cpp> +<ServoDriver.cpp>

[env:hw_limit]
extends = env:esp32dev
build_src_filter = -<*> +<../hardware_tests/t5_fim_de_curso.cpp>

[env:hw_wifi]
extends = env:esp32dev
build_src_filter = -<*> +<../hardware_tests/t6_wifi_ap.cpp>

[env:hw_http]
extends = env:esp32dev
build_src_filter = -<*> +<../hardware_tests/t7_http.cpp>

; ---- Testes de logica no PC (precisa de gcc/g++ no PATH) ----
; pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I include
build_src_filter = -<*>
